<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文排版助手 paiban</title>
  <meta name="description" content="检查并修正中文排版：中英文空格、全角标点、引号、省略号、破折号，并生成适合中文的网页排版 CSS。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23111'/><text x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='sans-serif'>排</text></svg>">
  <script>
    try { var l = localStorage.getItem("paiban-lang"); if (l === "en") document.documentElement.lang = "en"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#"><span class="logo">排</span><span data-t="brand"></span></a>
      <nav class="top-nav">
        <a href="#checker" data-t="navChecker"></a>
        <a href="#css" data-t="navCss"></a>
        <a href="#use" data-t="navUse"></a>
        <button id="lang" class="pill" type="button"></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <h1 data-t="heroTitle"></h1>
      <p class="lead" data-t="heroLead"></p>
      <div class="hero-demo" aria-hidden="true">
        <div><span class="tag bad" data-t="before"></span><p id="demo-before"></p></div>
        <div><span class="tag good" data-t="after"></span><p id="demo-after"></p></div>
      </div>
    </section>

    <section id="checker" class="wrap block">
      <div class="block-head">
        <h2 data-t="checkerTitle"></h2>
        <p data-t="checkerLead"></p>
      </div>

      <div class="panes">
        <div class="pane">
          <div class="pane-bar">
            <span data-t="input"></span>
            <span class="spacer"></span>
            <button id="sample" class="link" type="button" data-t="sample"></button>
            <button id="clear" class="link" type="button" data-t="clear"></button>
          </div>
          <textarea id="input" spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <div class="pane-bar">
            <div class="tabs" role="tablist">
              <button type="button" role="tab" data-view="marks" aria-selected="true" data-t="viewMarks"></button>
              <button type="button" role="tab" data-view="result" aria-selected="false" data-t="viewResult"></button>
            </div>
            <span class="spacer"></span>
            <button id="copy" class="link" type="button" data-t="copy"></button>
          </div>
          <div id="output" class="output" tabindex="0"></div>
        </div>
      </div>

      <div class="checker-foot">
        <div id="summary" class="summary"></div>
        <button id="apply" class="primary" type="button" data-t="apply"></button>
      </div>

      <details class="settings">
        <summary data-t="settings"></summary>
        <div class="settings-body">
          <div id="rules" class="rules"></div>
          <label class="field">
            <span data-t="quoteStyle"></span>
            <select id="quotes">
              <option value="curly" data-t="quoteCurly"></option>
              <option value="corner" data-t="quoteCorner"></option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <section id="css" class="wrap block">
      <div class="block-head">
        <h2 data-t="cssTitle"></h2>
        <p data-t="cssLead"></p>
      </div>
      <div class="css-grid">
        <form id="css-form" class="css-form">
          <label class="field"><span data-t="script"></span>
            <select name="script"><option value="sc" data-t="scriptSc"></option><option value="tc" data-t="scriptTc"></option></select></label>
          <label class="field"><span data-t="face"></span>
            <select name="face"><option value="sans" data-t="faceSans"></option><option value="serif" data-t="faceSerif"></option></select></label>
          <label class="field"><span><span data-t="size"></span> <output name="sizeOut"></output></span>
            <input type="range" name="size" min="14" max="22" step="1" value="17"></label>
          <label class="field"><span><span data-t="leading"></span> <output name="leadingOut"></output></span>
            <input type="range" name="leading" min="1.4" max="2.2" step="0.05" value="1.8"></label>
          <label class="field"><span><span data-t="tracking"></span> <output name="trackingOut"></output></span>
            <input type="range" name="tracking" min="0" max="0.1" step="0.01" value="0.02"></label>
          <label class="check"><input type="checkbox" name="justify" checked> <span data-t="justify"></span></label>
          <label class="check"><input type="checkbox" name="autospace" checked> <span data-t="autospace"></span></label>
          <label class="check"><input type="checkbox" name="trim" checked> <span data-t="trim"></span></label>
          <label class="check"><input type="checkbox" name="strict" checked> <span data-t="strict"></span></label>
          <label class="check"><input type="checkbox" name="emphasis" checked> <span data-t="emphasis"></span></label>
          <label class="check"><input type="checkbox" name="indent"> <span data-t="indent"></span></label>
        </form>
        <div class="css-out">
          <div class="preview-card"><article id="preview" class="zh-article"></article></div>
          <div class="code-card">
            <div class="pane-bar"><span>CSS</span><span class="spacer"></span><button id="copy-css" class="link" type="button" data-t="copy"></button></div>
            <pre><code id="css-code"></code></pre>
          </div>
          <p class="note" data-t="langNote"></p>
        </div>
      </div>
    </section>

    <section id="use" class="wrap block">
      <div class="block-head">
        <h2 data-t="useTitle"></h2>
        <p data-t="useLead"></p>
      </div>
      <div class="use-grid">
        <div class="use-card"><h3 data-t="useCli"></h3><pre><code>npx paiban docs/            <span class="c" data-t="cCheck"></span>
npx paiban --fix docs/      <span class="c" data-t="cFix"></span>
npx paiban --rules          <span class="c" data-t="cRules"></span></code></pre></div>
        <div class="use-card"><h3 data-t="useJs"></h3><pre><code>import { fix, check } from "paiban";

fix("使用GitHub托管,很方便!");
<span class="c">// → "使用 GitHub 托管，很方便！"</span></code></pre></div>
        <div class="use-card"><h3 data-t="useCi"></h3><pre><code><span class="c"># .github/workflows/docs.yml</span>
- uses: actions/setup-node@v7
- run: npx paiban docs/</code></pre></div>
      </div>
    </section>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
