<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>排版 · 中文排版在线修正</title>
  <meta name="description" content="免安装的中文排版工具：贴上文字，一键补好中英文空格、统一全角标点、引号、省略号和破折号，再复制回去。">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='4' y='4' width='56' height='56' rx='10' fill='%23b4232a'/><text x='32' y='44' font-size='32' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='700'>排</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
  <script>
    try { if (localStorage.getItem("paiban-lang") === "en") document.documentElement.lang = "en"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="#">
        <span class="seal" aria-hidden="true">排</span>
        <span class="wordmark" data-t="brand"></span>
      </a>
      <nav class="top-nav">
        <a href="#tool" data-t="navTool"></a>
        <a href="#rules" data-t="navRules"></a>
        <a href="#css" data-t="navCss"></a>
        <a href="#dev" data-t="navDev"></a>
      </nav>
      <button id="lang" class="lang" type="button"></button>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow"><span class="dot"></span><span data-t="eyebrow"></span></p>
      <h1 class="display" data-t="heroTitle"></h1>
      <p class="lead" data-t="heroLead"></p>
      <ol class="steps">
        <li><b>1</b><span data-t="step1"></span></li>
        <li><b>2</b><span data-t="step2"></span></li>
        <li><b>3</b><span data-t="step3"></span></li>
      </ol>
    </section>

    <!-- The tool comes first: paste, fix, copy. -->
    <section id="tool" class="wrap">
      <div class="tool">
        <div class="tool-bar">
          <div class="tool-actions">
            <button id="paste" class="ghost" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9zM7 5H5v15h14V5h-2"/></svg><span data-t="paste"></span></button>
            <label class="ghost" for="file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v4h16v-4"/></svg><span data-t="upload"></span></label>
            <input id="file" type="file" accept=".md,.markdown,.mdx,.txt,text/plain,text/markdown" hidden>
            <button id="sample" class="ghost" type="button" data-t="sample"></button>
            <button id="clear" class="ghost" type="button" data-t="clear"></button>
          </div>
          <div class="tabs" role="tablist">
            <button type="button" role="tab" data-view="marks" aria-selected="true" data-t="viewMarks"></button>
            <button type="button" role="tab" data-view="result" aria-selected="false" data-t="viewResult"></button>
          </div>
        </div>

        <div class="panes">
          <div class="pane" id="drop">
            <div class="pane-label"><span data-t="input"></span><span id="count" class="count"></span></div>
            <textarea id="input" spellcheck="false"></textarea>
            <div class="drop-hint" data-t="dropHint"></div>
          </div>
          <div class="pane pane-out">
            <div class="pane-label"><span data-t="output"></span><span class="legend"><i class="lg-del"></i><span data-t="legendDel"></span><i class="lg-ins"></i><span data-t="legendIns"></span></span></div>
            <div id="output" class="output" tabindex="0" aria-live="polite"></div>
          </div>
        </div>

        <div class="tool-foot">
          <div id="summary" class="summary"></div>
          <div class="foot-actions">
            <span class="kbd-hint"><kbd id="mod">Ctrl</kbd> + <kbd>Enter</kbd></span>
            <button id="download" class="secondary" type="button" data-t="download"></button>
            <button id="apply" class="secondary" type="button" data-t="apply"></button>
            <button id="copy" class="primary" type="button"><span data-t="copyResult"></span></button>
          </div>
        </div>
      </div>
      <p class="privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 1 1 12 0v2M5 10h14v11H5z"/></svg><span data-t="privacy"></span></p>
    </section>

    <section id="rules" class="wrap block">
      <div class="block-head">
        <p class="kicker">01</p>
        <h2 class="display" data-t="rulesTitle"></h2>
        <p data-t="rulesLead"></p>
      </div>
      <div id="rule-grid" class="rule-grid"></div>
      <label class="field quotes-field">
        <span data-t="quoteStyle"></span>
        <select id="quotes">
          <option value="curly" data-t="quoteCurly"></option>
          <option value="corner" data-t="quoteCorner"></option>
        </select>
      </label>
    </section>

    <section id="css" class="wrap block">
      <div class="block-head">
        <p class="kicker">02</p>
        <h2 class="display" data-t="cssTitle"></h2>
        <p data-t="cssLead"></p>
      </div>
      <div class="css-grid">
        <form id="css-form" class="css-form">
          <div class="row2">
            <label class="field"><span data-t="script"></span>
              <select name="script"><option value="sc" data-t="scriptSc"></option><option value="tc" data-t="scriptTc"></option></select></label>
            <label class="field"><span data-t="face"></span>
              <select name="face"><option value="sans" data-t="faceSans"></option><option value="serif" data-t="faceSerif"></option></select></label>
          </div>
          <label class="field"><span><span data-t="size"></span> <output name="sizeOut"></output></span>
            <input type="range" name="size" min="14" max="22" step="1" value="17"></label>
          <label class="field"><span><span data-t="leading"></span> <output name="leadingOut"></output></span>
            <input type="range" name="leading" min="1.4" max="2.2" step="0.05" value="1.8"></label>
          <label class="field"><span><span data-t="tracking"></span> <output name="trackingOut"></output></span>
            <input type="range" name="tracking" min="0" max="0.1" step="0.01" value="0.02"></label>
          <div class="checks">
            <label class="switch"><input type="checkbox" name="justify" checked><i></i><span data-t="justify"></span></label>
            <label class="switch"><input type="checkbox" name="autospace" checked><i></i><span data-t="autospace"></span></label>
            <label class="switch"><input type="checkbox" name="trim" checked><i></i><span data-t="trim"></span></label>
            <label class="switch"><input type="checkbox" name="strict" checked><i></i><span data-t="strict"></span></label>
            <label class="switch"><input type="checkbox" name="emphasis" checked><i></i><span data-t="emphasis"></span></label>
            <label class="switch"><input type="checkbox" name="indent"><i></i><span data-t="indent"></span></label>
          </div>
        </form>
        <div class="css-out">
          <div class="paper"><article id="preview"></article></div>
          <div class="code-card">
            <div class="code-bar"><span>CSS</span><button id="copy-css" class="ghost small" type="button" data-t="copy"></button></div>
            <pre><code id="css-code"></code></pre>
          </div>
          <p class="note" data-t="langNote"></p>
        </div>
      </div>
    </section>

    <section id="dev" class="wrap block">
      <div class="block-head">
        <p class="kicker">03</p>
        <h2 class="display" data-t="devTitle"></h2>
        <p data-t="devLead"></p>
      </div>
      <div class="dev-grid">
        <div class="code-card"><div class="code-bar"><span data-t="devCli"></span></div><pre><code>npx paiban docs/           <span class="c" data-t="cCheck"></span>
npx paiban --fix docs/     <span class="c" data-t="cFix"></span>
npx paiban --rules         <span class="c" data-t="cRules"></span></code></pre></div>
        <div class="code-card"><div class="code-bar"><span>JavaScript</span></div><pre><code>import { fix } from "paiban";

fix("用AI读唐诗,真方便!");
<span class="c">// "用 AI 读唐诗，真方便！"</span></code></pre></div>
        <div class="code-card"><div class="code-bar"><span>GitHub Actions</span></div><pre><code>- uses: actions/setup-node@v7
- run: npx paiban docs/</code></pre></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
